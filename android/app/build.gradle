plugins {
    id 'com.android.application'
}

android {
    namespace 'org.smc'
    // API 36 : depuis le 31 aout 2026, Google Play refuse toute nouvelle
    // application qui cible moins (API 35 etait deja exige depuis un an).
    compileSdk 36
    // NDK 27 LTS. Not 28+: those headers mark ALooper_pollAll as unavailable
    // and SDL 2.28.5 still calls it (SDL_androidsensor.c). Not 26 either: its
    // prebuilt libc++_shared.so is 4 KB-aligned, which fails Android's 16 KB
    // page-size check no matter what link flags our own libraries use.
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.takohi.secretchronicles"
        minSdk 21
        targetSdk 36
        versionCode 28
        versionName "2.0.27"

        // NDK ABI filters — default (debug): all 3 ABIs for testing on
        // phone, Wear OS (armv7), and x86_64 emulator. The release block
        // below overrides this to arm64-v8a only, since the Play Store
        // build targets phones and AAB splits handle the rest.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                // Passed to the NDK CMakeLists.txt
                // SDL2_mixer: SMC only ships .ogg (59) and .wav (16) audio.
                // STB vorbis is header-only, so no ogg/vorbis submodule is
                // needed; every other decoder is turned off because its
                // vendored backend would require a git submodule that
                // setup_deps.sh does not fetch (and would bloat the APK).
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_CPP_FEATURES=rtti exceptions",
                          "-DSDL2MIXER_VORBIS=STB",
                          "-DSDL2MIXER_FLAC=OFF",
                          "-DSDL2MIXER_MOD=OFF",
                          "-DSDL2MIXER_MP3=OFF",
                          "-DSDL2MIXER_MIDI=OFF",
                          "-DSDL2MIXER_OPUS=OFF",
                          "-DSDL2MIXER_WAVPACK=OFF",
                          "-DSDL2MIXER_GME=OFF"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // Release signing comes from a keystore.properties next to this module
    // (storeFile / storePassword / keyAlias / keyPassword). It is absent from
    // the public repository on purpose, and the release build then falls back
    // to the debug key so a clone still builds.
    def keystorePropertiesFile = rootProject.file( "keystore.properties" )
    def keystoreProperties = new Properties()
    if( keystorePropertiesFile.exists() ) {
        keystoreProperties.load( new FileInputStream( keystorePropertiesFile ) )
    }

    signingConfigs {
        release {
            if( keystorePropertiesFile.exists() ) {
                storeFile rootProject.file( keystoreProperties[ 'storeFile' ] )
                storePassword keystoreProperties[ 'storePassword' ]
                keyAlias keystoreProperties[ 'keyAlias' ]
                keyPassword keystoreProperties[ 'keyPassword' ]
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // Strip the ABI list down to arm64 only for phone releases.
            // ~95% of Play Store Android phones are arm64-v8a in 2026.
            // For Wear OS / 32-bit support, build a separate variant.
            ndk {
                abiFilters 'arm64-v8a'
            }
            // R8 minify + resource shrink — saves a few MB of unused
            // Java classes + resources. Keep rules in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
            externalNativeBuild {
                cmake {
                    // RelWithDebInfo = -O2 + debug symbols, unlike the default Debug (-O0).
                    // Without this, JNI debug builds run 5-10x slower than release.
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
        }
    }

    // AAB density/ABI splitting — Play Store generates per-device APKs
    // automatically. Each user downloads only the resources for their
    // density + ABI, cutting download size further.
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }

    packaging {
        jniLibs {
            // AGP compresses native libraries in debug builds to speed up
            // installs, but Android's 16 KB check needs them stored
            // uncompressed and page-aligned — otherwise every .so is reported
            // as "unknown error" in the compatibility dialog. Keeping debug
            // and release identical here is what makes the debug build
            // representative of what ships.
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main {
            // Bundle smc/data/ as APK assets so extractAssets() can copy them
            // to internal storage at runtime.
            //
            // Listing ../../smc/data directly would drop its *contents* at the
            // root of assets/, but SMCActivity extracts the "data" subtree and
            // DATA_DIR points at <filesDir>/data. So the tree is staged under
            // a generated directory that already has the "data" level.
            assets.srcDirs = [
                'src/main/assets',
                layout.buildDirectory.dir('generated/gameAssets').get().asFile
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AndroidX SplashScreen backport — gives us the Android 12+ splash
    // API behavior on every Android version we ship to (minSdk 21+).
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // SDL2 Android AAR — place the SDL2.aar (and SDL2_image, SDL2_mixer, SDL2_ttf AARs)
    // in android/app/libs/ and uncomment:
    //
    // implementation fileTree(dir: 'libs', include: ['*.aar'])
    //
    // Alternatively, if using local Maven repo built from SDL2 source:
    // implementation 'org.libsdl.app:SDL2:2.30.0@aar'
    // implementation 'org.libsdl.app:SDL2_image:2.8.0@aar'
    // implementation 'org.libsdl.app:SDL2_mixer:2.8.0@aar'
    // implementation 'org.libsdl.app:SDL2_ttf:2.22.0@aar'
}

// Stage smc/data/ as generated/gameAssets/data/ so it lands in the APK under
// assets/data/ (see sourceSets above).
def stageGameData = tasks.register('stageGameData', Copy) {
    from("$projectDir/../../smc/data")
    into(layout.buildDirectory.dir('generated/gameAssets/data'))
}

tasks.named('preBuild') {
    dependsOn stageGameData
}
